<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELODIENRAUSCH // TAGEBUCH 016</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow-x: hidden; }
  .main-content { min-height: 100vh; color: #000000; background:#f5f3ee; }
  .hero-header {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 30px 40px 10px 40px; box-sizing: border-box; z-index: 100;
  }
  .huge-title {
    color: #000000;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(20px, 3.2vw, 60px); font-weight: 700; line-height: 0.8;
    letter-spacing: -1px; text-transform: uppercase; margin: 0; white-space: nowrap;
  }

  .entry-grid {
    display: grid;
    grid-template-columns: minmax(120px, 200px) minmax(0, 560px);
    gap: 70px;
    max-width: 980px;
    margin: 0 auto;
    padding: clamp(300px, 26vw, 420px) 40px 140px;
    position: relative;
  }

  .meta-block {
    grid-column: 1;
    font-family: 'Oswald', sans-serif; font-size: 14px;
    line-height: 1.4; text-transform: uppercase; position: relative; z-index: 101;
  }
  .back-link {
    display: inline-block; margin-top: 18px; font-family: 'Oswald', sans-serif;
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #000000; text-decoration: none; border-bottom: 1px solid #000000; padding-bottom: 2px;
  }
  .back-link:hover { opacity: 0.6; }

  .entry-main { grid-column: 2; position: relative; z-index: 101; }
  .entry-headline {
    font-family: 'Courier New', 'Courier', monospace; font-weight: 700;
    font-size: clamp(19px, 2.2vw, 28px); line-height: 1.4;
    text-transform: none; margin: 0 0 36px 0; letter-spacing: 0.5px;
  }
  .entry-text { max-width: 560px; font-size: 17px; line-height: 1.75; font-family: Arial, Helvetica, sans-serif; }
  .entry-text p { margin: 0 0 13px 0; min-height: 1em; }
  .entry-text p.typing::after {
    content: '|';
    margin-left: 1px;
    animation: twBlink 0.8s steps(1) infinite;
  }

  @media (max-width: 720px) {
    .entry-grid { grid-template-columns: 1fr; gap: 24px; padding-top: clamp(180px, 34vw, 260px); }
    .meta-block { grid-column: 1; }
    .entry-main { grid-column: 1; }
  }

  .entry-headline.typing::after {
    content: '|';
    margin-left: 2px;
    animation: twBlink 0.8s steps(1) infinite;
  }
  @keyframes twBlink { 50% { opacity: 0; } }
</style>
</head>
<body>

  <div class="custom-cursor" id="cursor"></div>

  <div class="side-menu">
    <a href="index.html" class="menu-link">Heimat</a>
    <a href="werke.html" class="menu-link">Kunst</a>
    <a href="ueber.html" class="menu-link">Über mich</a>
    <a href="register.html" class="menu-link active">Tagebuch</a>
    <a href="kontakt.html" class="menu-link">Kontakt</a>
  </div>

  <div class="main-content">
    <div class="hero-header">
      <h1 class="huge-title">MELODIENRAUSCH®</h1>
      <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </div>

    <div class="entry-grid">
      <div class="meta-block">
        <strong>EINTRAG 016</strong>
        <br>
        <a href="register.html" class="back-link">&#9664; Zurück zum Tagebuch</a>
      </div>

      <div class="entry-main">
        <h2 class="entry-headline" id="tw-title" data-text="Ich dachte, ich hätte das längst hinter mir."></h2>
        <div class="entry-text" id="entry-body"></div>
      </div>
    </div>
  </div>

<script>
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
  });
  function toggleMenu() { document.body.classList.toggle('menu-open'); }

  const ENTRY_PARAGRAPHS = ["Heute habe ich gemerkt, dass man erwachsen und reflektiert sein kann.", "Man kann Therapie machen. Wissen, woher alte Wunden kommen. Alles schon hundertmal verstanden haben.", "Und trotzdem steht plötzlich wieder dieses kleine Mädchen mitten in der Küche.", "In der Arbeit ging es eigentlich um etwas Banales.", "Abläufe. Kommunikation. Wer was gesagt oder nicht gesagt hat.", "Also nichts, woraus man innerlich gleich ein komplettes Familiendrama bauen müsste.", "Mein Kopf sah das anders.", "Ich hatte wieder dieses Gefühl, außen vor zu sein. Nicht informiert. Nicht gesehen. Nicht ernst genommen.", "Alle wissen Bescheid.", "Nur ich nicht.", "Dann kam der Satz:", "„Hast du dich wieder beruhigt?“", "Vielleicht war er gar nicht böse gemeint.", "Aber in mir ging sofort etwas zu.", "Weil ich nicht nur diesen Satz gehört habe.", "Ich hörte: Stell dich nicht so an.", "Du bist schon wieder zu viel.", "Mach deine Gefühle kleiner, dann sind sie für uns angenehmer.", "Und plötzlich wusste ich nicht mehr, ob ich gerade auf Carmen reagiere, auf Marina, auf die Arbeit oder auf Stimmen, die mit dieser Küche gar nichts zu tun haben.", "Das ist das Anstrengende.", "Heute passiert etwas Kleines und innen antwortet ein ganz altes System.", "Ich hasse das manchmal.", "Weil ich sofort denke: Nicht schon wieder. Nicht wegen so etwas. Nicht mit fast fünfzig. Nicht in einer Küche.", "Aber es ging eben nicht nur um die Küche.", "Ich hatte mein Leben lang oft das Gefühl, mich erst erklären zu müssen, bevor mich überhaupt jemand hört. Als müsste ich beweisen, dass ich nicht übertreibe.", "Diesmal bin ich nicht komplett in den Kampf gegangen.", "Keine Beweisführung wie vor Gericht. Zumindest nicht ganz.", "Ich habe gemerkt: Das ist gerade größer als die Situation.", "Leichter wurde es dadurch nicht. Aber verständlicher.", "Vielleicht war ich nicht einfach empfindlich.", "Vielleicht hat jemand aus Versehen auf eine alte Stelle gedrückt.", "Das darf mich treffen, auch wenn es für andere klein aussieht.", "Ich bin heute eine andere.", "Aber die alte Stelle ist trotzdem noch da.", "Und sie will nicht schon wieder übergangen werden."];

  window.addEventListener('DOMContentLoaded', () => {
    typeWriter(document.getElementById('tw-title'), 38, () => {
      typeParagraphs(document.getElementById('entry-body'), ENTRY_PARAGRAPHS, 14, 350);
    });
  });

  function typeWriter(el, speed, onDone) {
    if (!el) return;
    const text = el.getAttribute('data-text') || '';
    el.textContent = '';
    el.classList.add('typing');
    let i = 0;
    (function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, speed);
      } else {
        el.classList.remove('typing');
        if (onDone) onDone();
      }
    })();
  }

  function typeParagraphs(container, paragraphs, speed, pause) {
    if (!container) return;
    let idx = 0;
    (function nextParagraph() {
      if (idx >= paragraphs.length) return;
      const p = document.createElement('p');
      p.classList.add('typing');
      container.appendChild(p);
      const text = paragraphs[idx];
      let i = 0;
      (function step() {
        if (i <= text.length) {
          p.textContent = text.slice(0, i);
          i++;
          setTimeout(step, speed);
        } else {
          p.classList.remove('typing');
          idx++;
          setTimeout(nextParagraph, pause);
        }
      })();
    })();
  }
</script>
</body>
</html>
