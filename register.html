<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELODIENRAUSCH // TAGEBUCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow-x: hidden; }
  .hero-header {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 30px 40px 10px 40px; box-sizing: border-box; z-index: 100;
  }
  .huge-title {
    font-family: 'Oswald', sans-serif; color: #000000;
    font-size: clamp(30px, 7.8vw, 180px); font-weight: 700; line-height: 0.8;
    letter-spacing: -2px; text-transform: uppercase; margin: 0; white-space: nowrap;
  }

  /* ===== 3D-Magazin-Tagebuch ===== */
  .diary-3d-wrapper {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    padding: 200px 0 60px 0;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    perspective: 2000px;
  }

  .book-environment {
    position: relative;
    width: 900px;
    max-width: 90vw;
    height: 580px;
    transform: rotateX(25deg) rotateY(-10deg) rotateZ(2deg);
    transform-style: preserve-3d;
    box-shadow: 0 50px 100px rgba(0,0,0,0.8);
  }

  .book-base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #000;
    border: 4px solid #e50914;
    box-sizing: border-box;
  }

  .page-3d {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
    cursor: pointer;
    z-index: 5;
  }

  .page-front, .page-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    padding: 40px;
    box-sizing: border-box;
    background: #ffffff;
    color: #000000;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
  }

  .page-back {
    transform: rotateY(180deg);
    background: #fcfcfc;
    border-left: 1px solid #ddd;
  }

  .page-front::after {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 15px;
    height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
  }

  .page-3d.flipped {
    transform: rotateY(-180deg);
  }

  .static-page-left {
    position: absolute;
    left: 0;
    top: 0;
    width: 50%;
    height: 100%;
    background: #ededed;
    color: #000;
    padding: 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .huge-title-diary {
    font-size: 4.5rem;
    font-weight: 900;
    line-height: 0.85;
    text-transform: uppercase;
    letter-spacing: -2px;
    margin: 0;
  }

  .pink-badge {
    background: #e50914;
    color: #fff;
    padding: 15px;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 1rem;
    margin-bottom: 20px;
    display: inline-block;
  }

  .text-content {
    font-size: 14px;
    line-height: 1.6;
    color: #333;
  }

  .text-content strong {
    font-size: 18px;
    color: #000;
    display: block;
    margin-bottom: 8px;
  }

  .page-number {
    font-size: 12px;
    font-weight: bold;
    border-top: 1px solid #ddd;
    padding-top: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .hint {
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    color: #e50914;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: bold;
    animation: pulse 1.5s infinite alternate;
  }

  @keyframes pulse {
    0% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  .content-layer {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  @keyframes introFromBehind {
    0%   { transform: scale(0.1); filter: blur(18px); opacity: 0; }
    60%  { filter: blur(2px); opacity: 1; }
    100% { transform: scale(1); filter: blur(0); opacity: 1; }
  }
  #intro-screen { perspective: 800px; }
  #intro-screen .intro-text {
    font-family:'Courier New'; font-size:24px; letter-spacing:10px;
    text-transform:uppercase; font-weight:bold;
    animation: introFromBehind 3s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }
</style>
</head>
<body>

  <div id="intro-screen" style="position:fixed; top:0; left:0; width:100%; height:100vh; background:#000; color:#fff; display:flex; justify-content:center; align-items:center; z-index:9999999; transition:opacity 0.6s ease;">
    <div class="intro-text">melodienrausch</div>
  </div>
  <div class="custom-cursor" id="cursor"></div>

  <div class="side-menu">
    <a href="index.html" class="menu-link">Heimat</a>
    <a href="werke.html" class="menu-link">Kunst</a>
    <a href="ueber.html" class="menu-link">Über mich</a>
    <a href="register.html" class="menu-link active">Tagebuch</a>
    <a href="kontakt.html" class="menu-link">Kontakt</a>
  </div>

  <div class="main-content">
    <div class="hero-header">
      <h1 class="huge-title">MELODIENRAUSCH®</h1>
      <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </div>

    <div class="diary-3d-wrapper">
      <div class="book-environment">
        <div class="book-base"></div>

        <div class="static-page-left" id="page-left-static">
          <div class="content-layer">
            <div>
              <div class="pink-badge" style="background:#000;"></div>
              <h1 class="huge-title-diary" style="color:#e50914;"></h1>
            </div>
            <div class="page-number">Seite 01</div>
          </div>
        </div>

        <div class="page-3d" id="flipPage" onclick="turnPage()">

          <div class="page-front" id="page-r-front">
            <div class="content-layer">
              <div>
                <div class="pink-badge"></div>
                <h1 class="huge-title-diary"></h1>
              </div>
              <div class="text-content">
              </div>
              <div class="page-number" style="text-align: right;">Seite 02 ▸</div>
            </div>
          </div>

          <div class="page-back" id="page-l-back">
            <div class="content-layer">
              <div>
                <h1 class="huge-title-diary" style="font-size: 3rem;"></h1>
              </div>
              <div class="text-content">
              </div>
              <div class="page-number">◀ Zurück | Seite 03</div>
            </div>
          </div>

        </div>

        <div class="hint">Klicke auf die rechte Buchseite zum Umblättern</div>
      </div>
    </div>
  </div>

<script>
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
  });
  function toggleMenu() { document.body.classList.toggle('menu-open'); }

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const intro = document.getElementById('intro-screen');
      if(intro) { intro.style.opacity = '0'; setTimeout(() => intro.remove(), 600); }
      document.body.classList.add('intro-done');
    }, 3400);
  });

  function turnPage() {
    const page = document.getElementById('flipPage');
    page.classList.toggle('flipped');
  }
</script>
</body>
</html>
