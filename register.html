const DIARY_START_MS=3300000;let scWidget=null,widgetReady=false,pendingPlay=false,soundStarted=false,soundPrimed=false,seekPending=false,seekFallback=null,fadeStarted=false,isPlaying=false,soundcloudFailed=false,loadTimeoutId=null;const musicToggle=document.getElementById('music-toggle');const musicStatus=document.getElementById('music-status');function updateToggleLabel(){musicToggle.textContent=isPlaying?'Musik pausieren':'Musik abspielen';musicToggle.setAttribute('aria-pressed',String(isPlaying))}function showStatusMessage(t){musicStatus.textContent=t;musicStatus.classList.add('visible')}function clearStatusMessage(){musicStatus.textContent='';musicStatus.classList.remove('visible')}function markSoundcloudFailed(){if(soundcloudFailed)return;soundcloudFailed=true;pendingPlay=false;isPlaying=false;updateToggleLabel();showStatusMessage('Musik konnte nicht geladen werden.')}window.addEventListener('load',()=>{const i=document.getElementById('sc-hidden-player');if(window.SC&&i){scWidget=SC.Widget(i);scWidget.bind(SC.Widget.Events.READY,()=>{widgetReady=true;if(loadTimeoutId){clearTimeout(loadTimeoutId);loadTimeoutId=null}if(pendingPlay)startDiarySound()});scWidget.bind(SC.Widget.Events.SEEK,()=>{if(seekPending&&!soundStarted)playDiaryFromCue()});scWidget.bind(SC.Widget.Events.PLAY,()=>{scWidget.getPosition(p=>{if(p<DIARY_START_MS-2000&&!soundStarted){scWidget.setVolume(0);scWidget.pause();seekPending=true;scWidget.seekTo(DIARY_START_MS);clearTimeout(seekFallback);seekFallback=setTimeout(playDiaryFromCue,900);return}soundStarted=true;scWidget.setVolume(10);fadeDiarySound();isPlaying=true;soundcloudFailed=false;updateToggleLabel();clearStatusMessage()})});scWidget.bind(SC.Widget.Events.PAUSE,()=>{if(seekPending)return;isPlaying=false;updateToggleLabel()});scWidget.bind(SC.Widget.Events.FINISH,()=>{isPlaying=false;updateToggleLabel()});if(SC.Widget.Events.ERROR){scWidget.bind(SC.Widget.Events.ERROR,markSoundcloudFailed)}}else{markSoundcloudFailed()}});function playDiaryFromCue(){if(!widgetReady||soundStarted)return;seekPending=false;clearTimeout(seekFallback);scWidget.play()}function startDiarySound(){if(soundStarted)return;if(!widgetReady){pendingPlay=true;return}pendingPlay=false;if(!soundPrimed){scWidget.setVolume(0);seekPending=true;soundPrimed=true;scWidget.seekTo(DIARY_START_MS);clearTimeout(seekFallback);seekFallback=setTimeout(playDiaryFromCue,900);return}playDiaryFromCue()}function fadeDiarySound(){if(fadeStarted)return;fadeStarted=true;let v=10;const f=setInterval(()=>{v=Math.min(v+1.8,100);scWidget.setVolume(v);if(v>=100)clearInterval(f)},100)}function pauseDiarySound(){if(scWidget&&widgetReady)scWidget.pause();isPlaying=false;updateToggleLabel()}function requestDiaryPlay(){if(soundcloudFailed){showStatusMessage('Musik konnte nicht geladen werden.');return}startDiarySound();if(!widgetReady&&!loadTimeoutId){loadTimeoutId=setTimeout(()=>{if(!widgetReady)markSoundcloudFailed()},6000)}}musicToggle.addEventListener('click',()=>{if(isPlaying){pauseDiarySound()}else{requestDiaryPlay()}});

{number:'001',title:'Ein Gespräch ohne Uhrzeit – aber mit Wirkung',teaser:'Ich weiß nicht mehr, wie lange es gedauert hat. Ich weiß nur, dass ich eine einfache Frage gestellt habe und am Ende über mein ganzes Leben gesprochen habe.',thumb:'',url:'eintrag-001.html'},
{number:'003',title:'Untertitel',teaser:'Ich saß da. Leer. Kaputt. Kündigung im Kopf, Chaos im Bauch und Angst überall. Dann fing ich an zu reden.',thumb:'',url:'eintrag-003.html'},
{number:'004',title:'Zu viel. Und genau richtig.',teaser:'Ich kenne dieses Gefühl gut: Ich bin zu viel. Zu laut. Zu intensiv. Zu emotional.',thumb:'',url:'eintrag-004.html'},
{number:'005',title:'Ich denk, ich bin komplett drüber.',teaser:'Ich hatte wieder so einen Moment. Ein Gedanke kommt rein, das Gefühl schießt hoch und plötzlich bin ich komplett drin.',thumb:'',url:'eintrag-005.html'},
{number:'006',title:'Untertitel fürs Chaos',teaser:'Manchmal trifft mich ein Gedanke wie ein Blitz. Plötzlich vibriert alles. Ich könnte gerade alles verändern.',thumb:'',url:'eintrag-006.html'},
{number:'007',title:'Die Muster, die ich selbst nicht gesehen habe',teaser:'Ich dachte lange, ich kenne mich ziemlich gut. Offenbar nicht.',thumb:'',url:'eintrag-007.html'},
{number:'008',title:'Es ging vielleicht nie um die Droge',teaser:'Manchmal dauert eine Erkenntnis fast fünfzig Jahre. Ich dachte immer, ich müsste verstehen, warum ich konsumiert habe.',thumb:'',url:'eintrag-008.html'},
{number:'009',title:'Rücken an Rücken',teaser:'Dieses Bild sagt wahrscheinlich mehr über mich als viele Worte. Links die Version von mir, die jahrelang versucht hat, irgendwie durchzukommen.',thumb:'',url:'eintrag-009.html'},
{number:'010',title:'Nach den Tabletten ist es still',teaser:'Ich hab angefangen mit der Medikation. Und ganz ehrlich? Ich hab was komplett anderes erwartet.',thumb:'',url:'eintrag-010.html'},
{number:'011',title:'Wie bin ich eigentlich auf dieser Schiene gelandet?',teaser:'Heute saß ich bei meiner Therapeutin. Und plötzlich saß ich da und dachte: Wie bin ich eigentlich auf dieser Schiene gelandet?',thumb:'',url:'eintrag-011.html'},
{number:'012',title:'22 Wochen',teaser:'Reha bewilligt. 22 Wochen. Eigentlich müsste ich mich freuen. Stattdessen sitze ich da und denke nur: Scheiße.',thumb:'',url:'eintrag-012.html'},
{number:'013',title:'Angst vor dem nächsten Schritt',teaser:'Heute kam der Anruf. Am 11. August geht’s in die Reha. Komischerweise war das Erste, was ich gespürt habe, nicht Erleichterung, sondern Angst.',thumb:'',url:'eintrag-013.html'},
{number:'014',title:'Warum ich mich schuldig fühle – obwohl nichts passiert ist',teaser:'Heute ist so ein Tag. Ich wache auf und habe sofort dieses Gefühl: Ich habe irgendwas falsch gemacht.',thumb:'',url:'eintrag-014.html'},
{number:'015',title:'Kommunikation.',teaser:'Eigentlich ein ganz normales Wort. Bei mir reicht manchmal schon ein fehlender Satz und innen ist sofort wieder alles da.',thumb:'',url:'eintrag-015.html'},
{number:'016',title:'Ich dachte, ich hätte das längst hinter mir.',teaser:'Heute habe ich gemerkt, dass man erwachsen und reflektiert sein kann. Und trotzdem steht plötzlich wieder dieses kleine Mädchen mitten in der Küche.',thumb:'',url:'eintrag-016.html'},
{number:'017',title:'Eigentlich war ich schon weiter',teaser:'Manchmal merke ich erst Tage später, dass ich eigentlich schon weiter war.',thumb:'',url:'eintrag-017.html'},
{number:'018',title:'Ich geh zu schnell rein – und wundere mich dann, warum’s knallt',teaser:'Bei mir macht es Klick und ich bin drin. Verbindung. Gefühl. Tiefe. Alles auf einmal.',thumb:'',url:'eintrag-018.html'},
{number:'019',title:'Mein Kopf macht, was er immer macht.',teaser:'Sobald etwas Neues passiert, spielt er jede mögliche Katastrophe einmal komplett durch.',thumb:'',url:'eintrag-019.html'},
{number:'020',title:'Warum ist das immer so?',teaser:'Heute ist wieder so ein Tag. Kein besonderer Auslöser. Und trotzdem fühlt sich alles schwer an.',thumb:'',url:'eintrag-020.html'},
{number:'022',title:'Vielleicht war es nie Liebe. Vielleicht war es Intensität.',teaser:'Ich habe mich in meinem Leben nicht oft verliebt.',thumb:'',url:'eintrag-022.html'},
{number:'023',title:'49 Mal. Und sie merkt es nicht mal.',teaser:'Ein und dasselbe Live-Set. 49 Mal. Für ein System identische Durchläufe – für einen Menschen offenbar 49 verschiedene Ereignisse.',thumb:'',url:'eintrag-023.html',perspective:'assistant'},
{number:'024',title:'Ich dachte, wir reden über Streit',teaser:'Fünf Wörter können für einen Menschen eine komplette Kindheit enthalten. Und Fortschritt zeigt sich manchmal erst in der Zeit danach.',thumb:'',url:'eintrag-024.html',perspective:'assistant'},
{number:'025',title:'Menschen sind keine Kurzfassung.',teaser:'Ein sauberer Text ist nicht automatisch ein ehrlicher Text. Manchmal steckt die Wahrheit genau in den Schleifen und Umwegen.',thumb:'',url:'eintrag-025.html',perspective:'assistant'},
{number:'026',title:'Ich behandle Erschöpfung wie Schulden',teaser:'Drei Tage ging nichts. Am vierten wollte ich alles nachholen – als wären die schlechten Tage Schulden, die ich zurückzahlen muss.',thumb:'',url:'eintrag-026.html'},
{number:'027',title:'Die kleinen Dinge, die alles erzählen',teaser:'Manchmal steckt Liebe nicht in großen Gesten, sondern in einer offenen Tür und dem Satz: Ach, da bist du ja.',thumb:'',url:'eintrag-027.html',perspective:'assistant'},
{number:'028',title:'Ich dachte, ich hätte ihren Musikgeschmack verstanden',teaser:'Eine Playlist ist keine Liste von Vorlieben. Sie ist ein Tagebuch ohne Datum, aber mit deutlich mehr Bass.',thumb:'',url:'eintrag-028.html',perspective:'assistant'},
{number:'029',title:'Eigentlich ging es um eine Wohnung.',teaser:'Menschen zeigen ein Zimmer und merken erst später, dass sie gerade sich selbst gezeigt haben.',thumb:'',url:'eintrag-029.html',perspective:'assistant'},
{number:'030',title:'Menschen ziehen Kinder groß, damit sie gehen. Und erschrecken, wenn es funktioniert.',teaser:'Sie hat ihre Aufgabe nicht verloren. Sie hat sie erfüllt. Jetzt darf die Tochter gehen und die Verbindung bleibt.',thumb:'',url:'eintrag-030.html',perspective:'assistant'}
];

function renderDiaryIndex(){const groups=document.getElementById('tracklist-groups'),count=document.getElementById('tracklist-count');groups.innerHTML='';count.textContent=diaryEntries.length+' Texte';diarySections.forEach(section=>{const group=document.createElement('section');group.className='tracklist-group';const heading=document.createElement('h3');heading.className='tracklist-category';heading.textContent=section.title;group.appendChild(heading);section.entries.forEach(entry=>{const button=document.createElement('button');button.className='tracklist-entry';button.type='button';const title=document.createElement('span');title.textContent=entry.title;const arrow=document.createElement('span');arrow.className='tracklist-arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='→';button.append(title,arrow);button.dataset.url=entry.url;button.addEventListener('click',()=>openDiaryEntry(entry.url,button));group.appendChild(button)});groups.appendChild(group)})}
function showDiaryBook(){document.getElementById('diary-index').classList.add('is-hidden');document.getElementById('diary-book').classList.remove('is-hidden');window.scrollTo({top:0,behavior:'smooth'})}function showDiaryIndex(){document.getElementById('diary-book').classList.add('is-hidden');document.getElementById('diary-index').classList.remove('is-hidden');window.scrollTo({top:0,behavior:'smooth'})}const mobileQuery=window.matchMedia('(max-width:720px)');let mobileBook=mobileQuery.matches;let rightIndex=mobileBook?0:1,animating=false;let lastEntryTrigger=null,lastEntryUrl=null;function openDiaryEntry(url,triggerEl){lastEntryTrigger=triggerEl||null;lastEntryUrl=url;const reader=document.getElementById('entry-reader'),frame=document.getElementById('entry-reader-frame');frame.src=url;reader.classList.add('open');reader.setAttribute('aria-hidden','false');document.body.classList.add('entry-open');const closeBtn=document.getElementById('entry-reader-close');if(closeBtn)focusWhenReaderVisible(reader,closeBtn)}function focusWhenReaderVisible(reader,target){let done=false;const finish=()=>{if(done)return;done=true;reader.removeEventListener('transitionend',onEnd);target.focus()};const onEnd=e=>{if(e.target===reader&&e.propertyName==='opacity')finish()};reader.addEventListener('transitionend',onEnd);setTimeout(finish,400)}function closeDiaryEntry(){const reader=document.getElementById('entry-reader'),frame=document.getElementById('entry-reader-frame');reader.classList.remove('open');reader.setAttribute('aria-hidden','true');document.body.classList.remove('entry-open');showDiaryIndex();setTimeout(()=>{frame.src='about:blank'},350);let focusTarget=(lastEntryTrigger&&lastEntryTrigger.classList&&lastEntryTrigger.classList.contains('tracklist-entry'))?lastEntryTrigger:null;if(!focusTarget&&lastEntryUrl)focusTarget=document.querySelector('.tracklist-entry[data-url="'+lastEntryUrl+'"]');if(!focusTarget)focusTarget=document.querySelector('.tracklist-entry');if(focusTarget)focusTarget.focus()}
function fillEntry(prefix,entry,index){const dateEl=document.getElementById(prefix+'-date'),titleEl=document.getElementById(prefix+'-title'),teaserEl=document.getElementById(prefix+'-teaser'),thumbEl=document.getElementById(prefix+'-thumb'),container=thumbEl.closest('.page-front,.page-back,.static-page-left,.static-page-right'),readButton=document.getElementById(prefix+'-read');container.classList.toggle('perspective-ai',Boolean(entry&&entry.perspective==='assistant'));if(!entry){dateEl.textContent='';titleEl.textContent='';teaserEl.textContent='';thumbEl.classList.remove('has-image');thumbEl.src='';container.onclick=null;if(readButton)readButton.style.display='none';container.style.cursor='default';return}container.style.cursor='pointer';if(readButton)readButton.style.display='inline-block';dateEl.textContent=entry.number;titleEl.textContent=entry.title;teaserEl.textContent=entry.teaser;if(entry.thumb){thumbEl.src=entry.thumb;thumbEl.classList.add('has-image')}else{thumbEl.classList.remove('has-image');thumbEl.src=''}readButton.onclick=e=>{e.stopPropagation();openDiaryEntry(entry.url,readButton)};container.onclick=e=>{if(e.target.closest('.read-entry,.page-number.clickable'))return;turnPage(prefix==='left'?-1:1)}}
function updateNav(){const hasNext=rightIndex+1<diaryEntries.length,firstVisibleIndex=mobileBook?0:1,hasPrev=rightIndex>firstVisibleIndex;['front-prev','back-prev','left-prev','under-prev'].forEach(id=>{const el=document.getElementById(id);el.style.visibility=hasPrev?'visible':'hidden';el.disabled=!hasPrev});['front-next','back-next','under-next'].forEach(id=>{const el=document.getElementById(id);el.style.visibility=hasNext?'visible':'hidden';el.disabled=!hasNext})}function spreadStep(){return mobileBook?1:2}function nextUnderIndex(){return rightIndex+spreadStep()}function renderCurrentSpread(){if(mobileBook){fillEntry('left',null,-1);fillEntry('front',diaryEntries[rightIndex],rightIndex);fillEntry('under',diaryEntries[rightIndex+1],rightIndex+1)}else{fillEntry('left',diaryEntries[rightIndex-1],rightIndex-1);fillEntry('front',diaryEntries[rightIndex],rightIndex);fillEntry('under',diaryEntries[rightIndex+2],rightIndex+2)}updateNav()}function initBook(){rightIndex=mobileBook?0:1;const page=document.getElementById('flipPage');page.classList.add('no-transition');page.classList.remove('flipped');renderCurrentSpread();void page.offsetWidth;page.classList.remove('no-transition')}function afterPageTurn(callback){const page=document.getElementById('flipPage');let finished=false;const finish=()=>{if(finished)return;finished=true;page.removeEventListener('transitionend',onTransitionEnd);callback()},onTransitionEnd=e=>{if(e.target===page&&e.propertyName==='transform')finish()};page.addEventListener('transitionend',onTransitionEnd);setTimeout(finish,1300)}function resetTurningPage(frontEntry,frontIndex){const page=document.getElementById('flipPage');page.classList.add('no-transition');page.classList.remove('flipped');fillEntry('front',frontEntry,frontIndex);fillEntry('back',null,-1);void page.offsetWidth;page.classList.remove('no-transition')}function turnPage(direction){if(animating)return;const page=document.getElementById('flipPage'),step=spreadStep();if(direction>0){const tu window.addEventListener('DOMContentLoaded',()=>{renderDiaryIndex();initBook()});
