<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELODIENRAUSCH // TAGEBUCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow-x: hidden; }
  .hero-header {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 30px 40px 10px 40px; box-sizing: border-box; z-index: 100;
  }
  .huge-title {
    font-family: 'Oswald', sans-serif; color: #000000;
    font-size: clamp(30px, 7.8vw, 180px); font-weight: 700; line-height: 0.8;
    letter-spacing: -2px; text-transform: uppercase; margin: 0; white-space: nowrap;
  }

  /* ===== 3D-Magazin-Tagebuch ===== */
  .diary-3d-wrapper {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    padding: 200px 0 60px 0;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    perspective: 2000px;
  }

  .book-environment {
    position: relative;
    width: 900px;
    max-width: 90vw;
    height: 580px;
    transform: rotateX(25deg) rotateY(-10deg) rotateZ(2deg);
    transform-style: preserve-3d;
    box-shadow: 0 50px 100px rgba(0,0,0,0.8);
  }

  .book-base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: transparent;
    border: 4px solid #e50914;
    box-sizing: border-box;
  }

  .page-3d {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
    cursor: pointer;
    z-index: 5;
  }

  .page-front, .page-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    padding: 40px;
    box-sizing: border-box;
    background: #ffffff;
    color: #000000;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
  }

  .page-back {
    transform: rotateY(180deg);
    background: #fcfcfc;
    border-left: 1px solid #ddd;
  }

  .page-front::after {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 15px;
    height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
  }

  .page-3d.flipped {
    transform: rotateY(-180deg);
  }

  .page-3d.no-transition {
    transition: none !important;
  }

  .static-page-left {
    position: absolute;
    left: 0;
    top: 0;
    width: 50%;
    height: 100%;
    background: #ededed;
    color: #000;
    padding: 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
  }

  .entry-thumb {
    width: 100%;
    height: 120px;
    object-fit: cover;
    margin-bottom: 16px;
    border: 1px solid #ddd;
    display: none;
  }
  .entry-thumb.has-image { display: block; }

  .page-number.clickable { cursor: pointer; }
  .page-number.clickable:hover { color: #e50914; }

  .huge-title-diary {
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    font-weight: 900;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: -1px;
    margin: 0 0 12px 0;
  }

  .pink-badge {
    background: #e50914;
    color: #fff;
    padding: 15px;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 1rem;
    margin-bottom: 20px;
    display: inline-block;
  }

  .text-content {
    font-size: 14px;
    line-height: 1.6;
    color: #333;
  }

  .text-content strong {
    font-size: 18px;
    color: #000;
    display: block;
    margin-bottom: 8px;
  }

  .page-number {
    font-size: 12px;
    font-weight: bold;
    border-top: 1px solid #ddd;
    padding-top: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  @keyframes pulse {
    0% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  .content-layer {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
</style>
</head>
<body>

  <div class="custom-cursor" id="cursor"></div>

  <div class="side-menu">
    <a href="index.html" class="menu-link">Heimat</a>
    <a href="werke.html" class="menu-link">Kunst</a>
    <a href="ueber.html" class="menu-link">Über mich</a>
    <a href="register.html" class="menu-link active">Tagebuch</a>
    <a href="kontakt.html" class="menu-link">Kontakt</a>
  </div>

  <div class="main-content">
    <div class="hero-header">
      <h1 class="huge-title">MELODIENRAUSCH®</h1>
      <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </div>

    <div class="diary-3d-wrapper">
      <div class="book-environment">
        <div class="book-base"></div>

        <div class="static-page-left" id="page-left-static">
          <div class="content-layer">
            <div>
              <div class="pink-badge" id="left-date"></div>
              <img class="entry-thumb" id="left-thumb" alt="">
              <h1 class="huge-title-diary" id="left-title" style="color:#e50914;"></h1>
              <div class="text-content" id="left-teaser"></div>
            </div>
            <div class="page-number" style="display:flex; justify-content:space-between;">
              <span id="left-prev" class="page-number clickable" style="border-top:none;" onclick="event.stopPropagation(); turnPage(-1);">◀ Zurück</span>
              <span>Seite <span id="left-page-nr">01</span></span>
            </div>
          </div>
        </div>

        <div class="page-3d" id="flipPage">

          <div class="page-front" id="page-r-front">
            <div class="content-layer">
              <div>
                <div class="pink-badge" id="front-date"></div>
                <img class="entry-thumb" id="front-thumb" alt="">
                <h1 class="huge-title-diary" id="front-title"></h1>
                <div class="text-content" id="front-teaser"></div>
              </div>
              <div class="page-number" style="display:flex; justify-content:space-between;">
                <span id="front-prev" class="page-number clickable" style="border-top:none;" onclick="event.stopPropagation(); turnPage(-1);">◀ Zurück</span>
                <span id="front-next" class="page-number clickable" style="border-top:none;" onclick="event.stopPropagation(); turnPage(1);">Seite <span id="front-page-nr">02</span> ▸</span>
              </div>
            </div>
          </div>

          <div class="page-back" id="page-l-back">
            <div class="content-layer">
              <div>
                <div class="pink-badge" id="back-date"></div>
                <img class="entry-thumb" id="back-thumb" alt="">
                <h1 class="huge-title-diary" id="back-title"></h1>
                <div class="text-content" id="back-teaser"></div>
              </div>
              <div class="page-number" style="display:flex; justify-content:space-between;">
                <span id="back-prev" class="page-number clickable" style="border-top:none;" onclick="event.stopPropagation(); turnPage(-1);">◀ Zurück</span>
                <span id="back-next" class="page-number clickable" style="border-top:none;" onclick="event.stopPropagation(); turnPage(1);">Seite <span id="back-page-nr">03</span> ▸</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

<script>
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
  });
  function toggleMenu() { document.body.classList.toggle('menu-open'); }

  // Diese Seite hat kein Intro (nur die 5 Hauptseiten haben das) — Inhalt
  // sofort sichtbar machen, sonst bleibt .main-content dauerhaft bei opacity:0
  // (siehe style.css: body.intro-done .main-content { opacity: 1; })
  document.body.classList.add('intro-done');

  window.addEventListener('DOMContentLoaded', () => {
    initBook();
  });

  /* ===== Tagebuch-Einträge: HIER echte Einträge eintragen/ersetzen ===== */
  const diaryEntries = [
    { number: '001', title: 'Ein Gespräch ohne Uhrzeit – aber mit Wirkung', teaser: 'Ich weiß nicht mehr, wie lange es gedauert hat. Ich weiß nur, dass ich eine einfache Frage gestellt habe und am Ende über mein ganzes Leben gesprochen habe.', thumb: '', url: 'eintrag-001.html' },
    { number: '003', title: 'Untertitel', teaser: 'Ich saß da. Leer. Kaputt. Kündigung im Kopf, Chaos im Bauch und Angst überall. Dann fing ich an zu reden.', thumb: '', url: 'eintrag-003.html' },
    { number: '004', title: 'Zu viel. Und genau richtig.', teaser: 'Ich kenne dieses Gefühl gut: Ich bin zu viel. Zu laut. Zu intensiv. Zu emotional.', thumb: '', url: 'eintrag-004.html' },
    { number: '005', title: 'Ich denk, ich bin komplett drüber.', teaser: 'Ich hatte wieder so einen Moment. Ein Gedanke kommt rein, das Gefühl schießt hoch und plötzlich bin ich komplett drin.', thumb: '', url: 'eintrag-005.html' },
    { number: '006', title: 'Untertitel fürs Chaos', teaser: 'Manchmal trifft mich ein Gedanke wie ein Blitz. Plötzlich vibriert alles. Ich könnte gerade alles verändern.', thumb: '', url: 'eintrag-006.html' },
    { number: '007', title: 'Die Muster, die ich selbst nicht gesehen habe', teaser: 'Ich dachte lange, ich kenne mich ziemlich gut. Offenbar nicht.', thumb: '', url: 'eintrag-007.html' },
    { number: '008', title: 'Es ging vielleicht nie um die Droge', teaser: 'Manchmal dauert eine Erkenntnis fast fünfzig Jahre. Ich dachte immer, ich müsste verstehen, warum ich konsumiert habe.', thumb: '', url: 'eintrag-008.html' },
    { number: '009', title: 'Rücken an Rücken', teaser: 'Dieses Bild sagt wahrscheinlich mehr über mich als viele Worte. Links die Version von mir, die jahrelang versucht hat, irgendwie durchzukommen.', thumb: '', url: 'eintrag-009.html' },
    { number: '010', title: 'Nach den Tabletten ist es still', teaser: 'Ich hab angefangen mit der Medikation. Und ganz ehrlich? Ich hab was komplett anderes erwartet.', thumb: '', url: 'eintrag-010.html' },
    { number: '011', title: 'Wie bin ich eigentlich auf dieser Schiene gelandet?', teaser: 'Heute saß ich bei meiner Therapeutin. Und plötzlich saß ich da und dachte: Wie bin ich eigentlich auf dieser Schiene gelandet?', thumb: '', url: 'eintrag-011.html' },
    { number: '012', title: '22 Wochen', teaser: 'Reha bewilligt. 22 Wochen. Eigentlich müsste ich mich freuen. Stattdessen sitze ich da und denke nur: Scheiße.', thumb: '', url: 'eintrag-012.html' },
    { number: '013', title: 'Angst vor dem nächsten Schritt', teaser: 'Heute kam der Anruf. Am 11. August geht’s in die Reha. Komischerweise war das Erste, was ich gespürt habe, nicht Erleichterung, sondern Angst.', thumb: '', url: 'eintrag-013.html' },
    { number: '014', title: 'Warum ich mich schuldig fühle – obwohl nichts passiert ist', teaser: 'Heute ist so ein Tag. Ich wache auf und habe sofort dieses Gefühl: Ich habe irgendwas falsch gemacht.', thumb: '', url: 'eintrag-014.html' },
    { number: '015', title: 'Kommunikation.', teaser: 'Eigentlich ein ganz normales Wort. Bei mir reicht manchmal schon ein fehlender Satz und innen ist sofort wieder alles da.', thumb: '', url: 'eintrag-015.html' },
    { number: '016', title: 'Ich dachte, ich hätte das längst hinter mir.', teaser: 'Heute habe ich gemerkt, dass man erwachsen und reflektiert sein kann. Und trotzdem steht plötzlich wieder dieses kleine Mädchen mitten in der Küche.', thumb: '', url: 'eintrag-016.html' },
    { number: '017', title: 'Eigentlich war ich schon weiter', teaser: 'Manchmal merke ich erst Tage später, dass ich eigentlich schon weiter war.', thumb: '', url: 'eintrag-017.html' },
    { number: '018', title: 'Ich geh zu schnell rein – und wundere mich dann, warum’s knallt', teaser: 'Bei mir macht es Klick und ich bin drin. Verbindung. Gefühl. Tiefe. Alles auf einmal.', thumb: '', url: 'eintrag-018.html' },
    { number: '019', title: 'Mein Kopf macht, was er immer macht.', teaser: 'Sobald etwas Neues passiert, spielt er jede mögliche Katastrophe einmal komplett durch.', thumb: '', url: 'eintrag-019.html' },
    { number: '020', title: 'Warum ist das immer so?', teaser: 'Heute ist wieder so ein Tag. Kein besonderer Auslöser. Und trotzdem fühlt sich alles schwer an.', thumb: '', url: 'eintrag-020.html' },
  ];

  let rightIndex = 1;
  let animating = false;

  function fillEntry(prefix, entry, index) {
    const dateEl = document.getElementById(prefix + '-date');
    const titleEl = document.getElementById(prefix + '-title');
    const teaserEl = document.getElementById(prefix + '-teaser');
    const thumbEl = document.getElementById(prefix + '-thumb');
    const pageNrEl = document.getElementById(prefix + '-page-nr');
    const container = thumbEl.closest('.page-front, .page-back, .static-page-left');

    if (!entry) {
      dateEl.textContent = ''; titleEl.textContent = ''; teaserEl.textContent = '';
      thumbEl.classList.remove('has-image'); thumbEl.src = '';
      if (pageNrEl) pageNrEl.textContent = '';
      container.onclick = null;
      container.style.cursor = 'default';
      return;
    }
    container.style.cursor = 'pointer';
    dateEl.textContent = entry.number;
    titleEl.textContent = entry.title;
    teaserEl.textContent = entry.teaser;
    if (pageNrEl) pageNrEl.textContent = entry.number;
    if (entry.thumb) { thumbEl.src = entry.thumb; thumbEl.classList.add('has-image'); }
    else { thumbEl.classList.remove('has-image'); thumbEl.src = ''; }

    container.onclick = (e) => {
      if (e.target.closest('.book-nav')) return;
      window.location.href = entry.url;
    };
  }

  function updateNav() {
    const hasNext = rightIndex + 1 < diaryEntries.length;
    const hasPrev = rightIndex - 1 >= 1;
    ['front-prev', 'back-prev', 'left-prev'].forEach((id) => {
      document.getElementById(id).style.visibility = hasPrev ? 'visible' : 'hidden';
    });
    ['front-next', 'back-next'].forEach((id) => {
      document.getElementById(id).style.visibility = hasNext ? 'visible' : 'hidden';
    });
  }

  function initBook() {
    fillEntry('left', diaryEntries[0], 0);
    fillEntry('front', diaryEntries[1], 1);
    updateNav();
  }

  function turnPage(direction) {
    if (animating) return;
    const page = document.getElementById('flipPage');

    if (direction > 0) {
      if (rightIndex + 1 >= diaryEntries.length) return;
      const nextIndex = rightIndex + 1;
      animating = true;

      fillEntry('back', diaryEntries[nextIndex], nextIndex);
      page.classList.add('flipped');

      setTimeout(() => {
        page.classList.add('no-transition');
        page.classList.remove('flipped');
        void page.offsetWidth;
        fillEntry('front', diaryEntries[nextIndex], nextIndex);
        page.classList.remove('no-transition');
        animating = false;
      }, 1200);

      rightIndex = nextIndex;
      fillEntry('left', diaryEntries[rightIndex - 1], rightIndex - 1);
      updateNav();
    } else {
      if (rightIndex - 1 < 1) return;
      rightIndex -= 1;
      fillEntry('front', diaryEntries[rightIndex], rightIndex);
      fillEntry('left', diaryEntries[rightIndex - 1], rightIndex - 1);
      updateNav();
    }
  }
</script>

</body>
</html>
