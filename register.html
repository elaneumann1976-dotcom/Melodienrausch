<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELODIENRAUSCH // TAGEBUCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow-x: hidden; }
  .hero-header {
    position: fixed; top: 0; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 30px 40px 10px 40px; box-sizing: border-box; z-index: 100;
  }
  .huge-title {
    font-family: 'Oswald', sans-serif; color: #000000;
    font-size: clamp(30px, 7.8vw, 180px); font-weight: 700; line-height: 0.8;
    letter-spacing: -2px; text-transform: uppercase; margin: 0; white-space: nowrap;
  }

  /* ===== 3D-Magazin-Tagebuch ===== */
  .diary-3d-wrapper {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    margin: 0;
    padding: 200px 0 60px 0;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    perspective: 2000px;
  }

  .book-environment {
    position: relative;
    width: 900px;
    max-width: 90vw;
    height: 580px;
    transform: rotateX(25deg) rotateY(-10deg) rotateZ(2deg);
    transform-style: preserve-3d;
    box-shadow: 0 50px 100px rgba(0,0,0,0.8);
  }

  .book-base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #000;
    border: 4px solid #e50914;
    box-sizing: border-box;
  }

  .page-3d {
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
    cursor: pointer;
    z-index: 5;
  }

  .page-front, .page-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    padding: 40px;
    box-sizing: border-box;
    background: #ffffff;
    color: #000000;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
  }

  .page-back {
    transform: rotateY(180deg);
    background: #fcfcfc;
    border-left: 1px solid #ddd;
  }

  .page-front::after {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    width: 15px;
    height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.15), transparent);
  }

  .page-3d.flipped {
    transform: rotateY(-180deg);
  }

  .static-page-left {
    position: absolute;
    left: 0;
    top: 0;
    width: 50%;
    height: 100%;
    background: #ededed;
    color: #000;
    padding: 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
  }

  .entry-thumb {
    width: 100%;
    height: 120px;
    object-fit: cover;
    margin-bottom: 16px;
    border: 1px solid #ddd;
    display: none;
  }
  .entry-thumb.has-image { display: block; }

  .page-number.clickable { cursor: pointer; }
  .page-number.clickable:hover { color: #e50914; }

  .huge-title-diary {
    font-size: clamp(1.6rem, 2.6vw, 2.4rem);
    font-weight: 900;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: -1px;
    margin: 0 0 12px 0;
  }

  .pink-badge {
    background: #e50914;
    color: #fff;
    padding: 15px;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 1rem;
    margin-bottom: 20px;
    display: inline-block;
  }

  .text-content {
    font-size: 14px;
    line-height: 1.6;
    color: #333;
  }

  .text-content strong {
    font-size: 18px;
    color: #000;
    display: block;
    margin-bottom: 8px;
  }

  .page-number {
    font-size: 12px;
    font-weight: bold;
    border-top: 1px solid #ddd;
    padding-top: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  @keyframes pulse {
    0% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  .content-layer {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  @keyframes introFromBehind {
    0%   { transform: scale(0.1); filter: blur(18px); opacity: 0; }
    60%  { filter: blur(2px); opacity: 1; }
    100% { transform: scale(1); filter: blur(0); opacity: 1; }
  }
  #intro-screen { perspective: 800px; }
  #intro-screen .intro-text {
    font-family:'Courier New'; font-size:24px; letter-spacing:10px;
    text-transform:uppercase; font-weight:bold;
    animation: introFromBehind 3s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }
</style>
</head>
<body>

  <div id="intro-screen" style="position:fixed; top:0; left:0; width:100%; height:100vh; background:#000; color:#fff; display:flex; justify-content:center; align-items:center; z-index:9999999; transition:opacity 0.6s ease;">
    <div class="intro-text">melodienrausch</div>
  </div>
  <div class="custom-cursor" id="cursor"></div>

  <div class="side-menu">
    <a href="index.html" class="menu-link">Heimat</a>
    <a href="werke.html" class="menu-link">Kunst</a>
    <a href="ueber.html" class="menu-link">Über mich</a>
    <a href="register.html" class="menu-link active">Tagebuch</a>
    <a href="kontakt.html" class="menu-link">Kontakt</a>
  </div>

  <div class="main-content">
    <div class="hero-header">
      <h1 class="huge-title">MELODIENRAUSCH®</h1>
      <div class="menu-icon" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </div>

    <div class="diary-3d-wrapper">
      <div class="book-environment">
        <div class="book-base"></div>

        <div class="static-page-left" id="page-left-static">
          <div class="content-layer">
            <div>
              <div class="pink-badge" id="left-date"></div>
              <img class="entry-thumb" id="left-thumb" alt="">
              <h1 class="huge-title-diary" id="left-title" style="color:#e50914;"></h1>
              <div class="text-content" id="left-teaser"></div>
            </div>
            <div class="page-number" id="left-page-num">Seite 01</div>
          </div>
        </div>

        <div class="page-3d" id="flipPage">

          <div class="page-front" id="page-r-front">
            <div class="content-layer">
              <div>
                <div class="pink-badge" id="front-date"></div>
                <img class="entry-thumb" id="front-thumb" alt="">
                <h1 class="huge-title-diary" id="front-title"></h1>
                <div class="text-content" id="front-teaser"></div>
              </div>
              <div class="page-number" id="front-page-num" style="text-align: right;" onclick="event.stopPropagation(); turnPage(1);">Seite 02 ▸</div>
            </div>
          </div>

          <div class="page-back" id="page-l-back">
            <div class="content-layer">
              <div>
                <div class="pink-badge" id="back-date"></div>
                <img class="entry-thumb" id="back-thumb" alt="">
                <h1 class="huge-title-diary" id="back-title"></h1>
                <div class="text-content" id="back-teaser"></div>
              </div>
              <div class="page-number" id="back-page-num" onclick="event.stopPropagation(); turnPage(-1);">◀ Zurück | Seite 03</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

<script>
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', (e) => {
    cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
  });
  function toggleMenu() { document.body.classList.toggle('menu-open'); }

  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const intro = document.getElementById('intro-screen');
      if(intro) { intro.style.opacity = '0'; setTimeout(() => intro.remove(), 600); }
      document.body.classList.add('intro-done');
    }, 3400);
    renderSpread(0);
  });

  /* ===== Tagebuch-Einträge: HIER echte Einträge eintragen/ersetzen ===== */
  const diaryEntries = [
    { title: "WENN DER BASS", teaser: "Kurzer Teaser-Text für den ersten Eintrag, ein bis drei Sätze, die neugierig machen sollen.", thumb: "", url: "eintrag-01.html" },
    { title: "STILLE NÄCHTE", teaser: "Kurzer Teaser-Text für den zweiten Eintrag.", thumb: "", url: "eintrag-02.html" },
    { title: "NEUE WEGE", teaser: "Kurzer Teaser-Text für den dritten Eintrag.", thumb: "", url: "eintrag-03.html" },
    { title: "ROHE SPUREN", teaser: "Kurzer Teaser-Text für den vierten Eintrag.", thumb: "", url: "eintrag-04.html" }
  ];

  let spreadStart = 0;

  function fillEntry(prefix, entry, index) {
    const dateEl = document.getElementById(prefix + '-date');
    const titleEl = document.getElementById(prefix + '-title');
    const teaserEl = document.getElementById(prefix + '-teaser');
    const thumbEl = document.getElementById(prefix + '-thumb');
    const container = thumbEl.closest('.page-front, .page-back, .static-page-left');

    if (!entry) {
      dateEl.textContent = ''; titleEl.textContent = ''; teaserEl.textContent = '';
      thumbEl.classList.remove('has-image'); thumbEl.src = '';
      container.onclick = null;
      container.style.cursor = 'default';
      return;
    }
    container.style.cursor = 'pointer';
    dateEl.textContent = String(index + 1).padStart(3, '0');
    titleEl.textContent = entry.title;
    teaserEl.textContent = entry.teaser;
    if (entry.thumb) { thumbEl.src = entry.thumb; thumbEl.classList.add('has-image'); }
    else { thumbEl.classList.remove('has-image'); thumbEl.src = ''; }

    container.onclick = (e) => {
      if (e.target.closest('.book-nav')) return;
      window.location.href = entry.url;
    };
  }

  function renderSpread(start) {
    spreadStart = start;
    fillEntry('left', diaryEntries[start], start);
    fillEntry('front', diaryEntries[start + 1], start + 1);
    fillEntry('back', diaryEntries[start + 2], start + 2);

    const hasPrev = start > 0;
    const hasNext = start + 2 < diaryEntries.length;
    const frontNum = document.getElementById('front-page-num');
    const backNum = document.getElementById('back-page-num');
    frontNum.style.visibility = hasNext ? 'visible' : 'hidden';
    frontNum.classList.toggle('clickable', hasNext);
    backNum.style.visibility = hasPrev ? 'visible' : 'hidden';
    backNum.classList.toggle('clickable', hasPrev);
  }

  function turnPage(direction) {
    const page = document.getElementById('flipPage');
    if (direction > 0) {
      if (spreadStart + 2 >= diaryEntries.length) return;
      page.style.transition = 'transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
      page.classList.add('flipped');
      page.addEventListener('transitionend', function handler() {
        page.removeEventListener('transitionend', handler);
        page.style.transition = 'none';
        page.classList.remove('flipped');
        void page.offsetWidth;
        page.style.transition = 'transform 1.2s cubic-bezier(0.4, 0, 0.2, 1)';
        renderSpread(spreadStart + 2);
      }, { once: true });
    } else {
      if (spreadStart <= 0) return;
      renderSpread(spreadStart - 2);
    }
  }
</script>
</body>
</html>
